<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculator</title>
<style>
  :root { --bg:#eef3ee; --card:#fff; --fg:#223e35; --muted:rgba(34,62,53,.6); --key:#e8efe9; --op:#a3c481; --eq:#223e35; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); font-family:system-ui,-apple-system,sans-serif; color:var(--fg); }
  .calc { width:min(340px,92vw); background:var(--card); border-radius:28px; padding:20px; box-shadow:0 20px 50px rgba(34,62,53,.15); }
  .screen { padding:14px 8px 18px; text-align:right; }
  .prev { min-height:22px; font-size:16px; color:var(--muted); overflow-wrap:anywhere; }
  .cur { font-size:44px; font-weight:600; overflow-wrap:anywhere; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  button { border:0; border-radius:18px; height:64px; font-size:22px; background:var(--key); color:var(--fg); cursor:pointer; transition:transform .05s, filter .15s; }
  button:hover { filter:brightness(.96); }
  button:active { transform:scale(.96); }
  .op { background:var(--op); }
  .eq { background:var(--eq); color:#fff; }
  .wide { grid-column:span 2; }
</style>
</head>
<body>
<div class="calc">
  <div class="screen"><div class="prev" id="prev"></div><div class="cur" id="cur">0</div></div>
  <div class="keys">
    <button data-a="clear">AC</button><button data-a="del">⌫</button><button data-a="pct">%</button><button class="op" data-op="/">÷</button>
    <button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button class="op" data-op="*">×</button>
    <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button class="op" data-op="-">−</button>
    <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button class="op" data-op="+">+</button>
    <button class="wide" data-n="0">0</button><button data-n=".">.</button><button class="eq" data-a="eq">=</button>
  </div>
</div>
<script>
  const curEl = document.getElementById('cur'), prevEl = document.getElementById('prev');
  const sym = { '/':'÷', '*':'×', '-':'−', '+':'+' };
  let cur = '0', prev = null, op = null, fresh = false;

  const fmt = n => { if (!isFinite(n)) return 'Error'; return String(parseFloat(n.toPrecision(12))); };
  const calc = (a, b, o) => o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : b === 0 ? NaN : a / b;
  const render = () => { curEl.textContent = cur; prevEl.textContent = prev !== null && op ? `${prev} ${sym[op]}` : ''; };

  function digit(d) {
    if (cur === 'Error' || fresh) { cur = '0'; fresh = false; }
    if (d === '.' && cur.includes('.')) return;
    cur = (cur === '0' && d !== '.') ? d : cur + d;
  }
  function setOp(o) {
    if (cur === 'Error') return;
    if (op && !fresh) { cur = fmt(calc(parseFloat(prev), parseFloat(cur), op)); }
    prev = cur; op = o; fresh = true;
  }
  function equals() {
    if (!op || cur === 'Error') return;
    cur = fmt(calc(parseFloat(prev), parseFloat(cur), op)); prev = null; op = null; fresh = true;
  }
  function action(a) {
    if (a === 'clear') { cur = '0'; prev = null; op = null; fresh = false; }
    if (a === 'del' && !fresh && cur !== 'Error') cur = cur.length > 1 ? cur.slice(0, -1) : '0';
    if (a === 'pct' && cur !== 'Error') cur = fmt(parseFloat(cur) / 100);
    if (a === 'eq') equals();
  }

  document.querySelector('.keys').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.n) digit(b.dataset.n); else if (b.dataset.op) setOp(b.dataset.op); else action(b.dataset.a);
    render();
  });
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (/^[0-9.]$/.test(k)) digit(k);
    else if ('+-*/'.includes(k)) setOp(k);
    else if (k === 'Enter' || k === '=') { e.preventDefault(); equals(); }
    else if (k === 'Backspace') action('del');
    else if (k === 'Escape') action('clear');
    else if (k === '%') action('pct');
    else return;
    render();
  });
  render();
</script>
</body>
</html>
